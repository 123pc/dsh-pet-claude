<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude · 跳起后张臂</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#263b4c;font:16px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1240px;margin:32px auto;padding:0 24px}h1{font-size:32px;margin:8px 0}h2{font-size:21px;margin:0}p{margin:8px 0 20px}.eyebrow{letter-spacing:3px;font-size:12px;color:#ae6f43}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fffdf8;border:1px solid #dedfd8;border-radius:18px;overflow:hidden}.dance{grid-column:1/-1}.head{padding:18px 22px}.head p{font-size:13px;color:#637885;margin:5px 0 0}.stage{position:relative;background:#e7ece6;display:grid;place-items:center}.stage video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}.stage video[hidden]{display:none}.dance video{max-width:900px}.tools{padding:14px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;color:inherit;border:1px solid #b9c7bd;background:#f2f6ef;border-radius:8px;padding:6px 13px;cursor:pointer}button:hover{background:#dfeade}button:focus-visible{outline:3px solid #c38d5f}.badge{font-size:12px;background:#f7e6d5;color:#966036;border-radius:12px;padding:1px 8px}.bubble{position:absolute;left:50%;top:7%;transform:translateX(-50%);padding:8px 16px;border:1px solid #c8d4ca;background:#fffdf7;border-radius:14px;white-space:nowrap;font-size:14px}.bubble[hidden]{display:none}.dark .stage{background:#253345}.note{font-size:13px;color:#637885}@media(max-width:760px){.grid{grid-template-columns:1fr}main{margin:20px auto}h1{font-size:26px}}
</style>
<main><div class="eyebrow">CLAUDE · DAFEIYU</div><h1>跳起来，再张开双臂。</h1><p id="status">屈膝蓄力，跳起后在空中张臂欢呼，落地缓冲后笑着站稳。敬礼和回眸保留。</p>
<div class="tools" style="padding:0 0 20px"><button id="theme">切换深浅背景</button><span class="note">开发预览 · 市场发布版仍为 0.7.2</span></div>
<div class="grid">
<article class="card dance"><div class="head"><h2>跳起后张臂 <span class="badge">__DURATION__ 秒</span></h2><p>屈膝蓄力 → 起跳 → 空中张臂 → 落地缓冲 → 笑着站稳</p></div><div class="stage"><video id="happy" muted playsinline controls preload="auto" poster="happy-open-arms-poster.png?v=__SHA__" src="../__SOURCE__?v=__SHA__"></video></div><div class="tools"><button data-play="happy">播放跳起后张臂</button><span class="note">__COUNT__ 张完整人物关键帧 · 24fps 透明视频</span></div></article>
<article class="card"><div class="head"><h2>抱文件认真敬礼 <span class="badge">接单开场</span></h2><p>收到新工作时播放一次，并显示“收到任务，马上开始！”</p></div><div class="stage"><video id="salute" muted playsinline controls preload="auto" src="../animation/抱文件认真敬礼.webm"></video><div id="ack" class="bubble" hidden>收到任务，马上开始！</div></div><div class="tools"><button data-play="salute">演示接单片段</button></div></article>
<article class="card"><div class="head"><h2>转身回眸 · 发梢随风 <span class="badge">4.5 秒</span></h2><p>慢慢回眸，发梢和鲸尾轻摆，再转回来看你。</p></div><div class="stage"><video id="breeze" muted playsinline controls preload="auto" src="../animation/转身回眸·发梢随风.webm"></video></div><div class="tools"><button data-play="breeze">从头播放</button></div></article>
</div><p class="note" style="margin-top:24px">敬礼与回眸保留；原走路及原有 119 段视频保持原文件。</p></main>
<script>
document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');
const videos=[...document.querySelectorAll('video')],ack=document.getElementById('ack');
for(const button of document.querySelectorAll('[data-play]'))button.onclick=()=>{for(const v of videos)v.pause();const v=document.getElementById(button.dataset.play);v.currentTime=0;v.play()};
const salute=document.getElementById('salute');salute.addEventListener('play',()=>ack.hidden=false);salute.addEventListener('ended',()=>ack.hidden=true);salute.addEventListener('pause',()=>{if(salute.currentTime===0||salute.ended)ack.hidden=true});
</script></html>
